<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excitat Brand Template</title>
<style>
  /* Reset */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Main container — 1200x1200 for e-commerce listing */
  .listing-frame {
    width: 1200px;
    height: 1200px;
    position: relative;
    overflow: hidden;
    background: #0a0a1a;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  /* AI-generated main image */
  .listing-frame .main-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* Top gradient overlay for text readability */
  .listing-frame .top-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 280px;
    background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.3) 60%, transparent 100%);
    z-index: 2;
  }

  /* Bottom brand bar */
  .listing-frame .brand-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 72px;
    background: linear-gradient(135deg, #1a1040 0%, #0d0b2e 50%, #1a0a30 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    z-index: 10;
    border-top: 2px solid rgba(200, 50, 50, 0.6);
  }

  /* Brand name — EXCITAT in red metallic style */
  .brand-bar .brand-name {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 6px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ff4444 0%, #cc2222 40%, #991111 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 1px 2px rgba(255,0,0,0.3));
  }

  /* eMAG genius badge (green) */
  .brand-bar .emag-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #00b341;
    color: white;
    font-size: 13px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 4px;
    text-transform: lowercase;
  }

  .brand-bar .emag-badge svg {
    width: 16px;
    height: 16px;
  }

  /* Headline text overlay */
  .listing-frame .headline {
    position: absolute;
    top: 40px;
    left: 48px;
    right: 48px;
    z-index: 5;
    color: white;
  }

  .headline h1 {
    font-size: 52px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -1px;
    text-transform: uppercase;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.5);
    margin-bottom: 12px;
  }

  .headline p {
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 10px rgba(0,0,0,0.8);
    line-height: 1.4;
  }

  /* Right-side brand logo area */
  .listing-frame .brand-logo-corner {
    position: absolute;
    top: 20px;
    right: 24px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
  }

  .brand-logo-corner .brand-text {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 4px;
    background: linear-gradient(180deg, #ff4444 0%, #cc2222 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* Feature icons strip (for specs image) */
  .listing-frame .feature-strip {
    position: absolute;
    bottom: 90px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-around;
    padding: 16px 32px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(8px);
    z-index: 5;
  }

  .feature-strip .feature {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: white;
  }

  .feature-strip .feature .icon {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1.5px solid rgba(255,255,255,0.4);
    border-radius: 50%;
  }

  .feature-strip .feature .label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
  }
</style>
</head>
<body style="background: #222; display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; justify-content: center;">
